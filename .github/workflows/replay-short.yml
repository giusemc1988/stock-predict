name: Atlas short lab

# Manual only (Chanh: no scheduled jobs). Round 6: four short-side ideas on free Yahoo daily bars, each against 200
# random-short draws with borrow fees and hard stops. Commits public/replay-short.json. Paper only; never touches live trading.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: replay-short
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run replay:short
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Commit result
        run: |
          git config user.email "replay@stock-predict"
          git config user.name "Atlas Replay Lab"
          git add public/replay-short.json
          git diff --cached --quiet && exit 0
          git commit -m "Atlas short lab $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
