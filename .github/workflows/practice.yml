# 24/7 practice trading: one stock-picker cycle every 15 minutes in US market hours, so the
# AI keeps paper-trading while the app is closed. Results go to public/practice.json, which
# the app shows on the chart, in the activity feed and in the Practice report.
# Schedule: :07/:22/:37/:52 from 13:07 to 21:52 UTC on weekdays (covers 9:30 am-4 pm ET in
# summer and winter time), about 36 runs of ~1 minute a day, roughly 800 minutes a month.
# With auto learning (~210) that stays well inside the 2,000 free minutes for a private repo.
# The file is only rewritten (one commit, one redeploy) when a trade happens or once an hour.
# Paper only: it fetches public Yahoo Finance data and never places an order.
# To turn it off: GitHub > Settings > Secrets and variables > Actions > Variables,
# add PRACTICE = off (or disable this workflow in the Actions tab).
name: Practice trading

on:
  schedule:
    - cron: '7,22,37,52 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: practice
  cancel-in-progress: false

jobs:
  cycle:
    if: vars.PRACTICE != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run practice
      - name: Save the practice account
        run: |
          git config user.name "arc-analyst-practice"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f public/practice.json ] || exit 0
          git add public/practice.json
          git diff --cached --quiet && exit 0
          git commit -m "Practice cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
