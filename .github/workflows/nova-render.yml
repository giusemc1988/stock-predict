# Nova render farm: turns the videos queued in Nova (Jarvis Hub) into MP4s with a real voice,
# footage and burned-in subtitles, using MoneyPrinterTurbo at the image pinned in nova/upstream.json.
#   1. pick   (Cloudflare token)  takes up to 3 queued jobs from the Worker's KV
#   2. render (NO secrets)        runs the upstream image with only the job folder mounted
#   3. store  (Cloudflare token)  puts each MP4 back in KV for Nova to play and download
# Free: public repos have unlimited Actions minutes. An empty queue ends in ~20 s.
# Nova starts this at once when a GitHub key is saved in step 5; otherwise the cron runs it, often hours late.
# Pull requests that touch nova/ render a built-in Vietnamese sample instead (no KV, no secrets)
# and upload it as an artifact, so a version bump is checked on a real video before merge.
name: Nova render

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  pull_request:
    paths: ['nova/**', '.github/workflows/nova-render.yml']

permissions:
  contents: read
  actions: write # only to start this workflow again when the queue is longer than one run

concurrency:
  group: nova-render-${{ github.event_name == 'pull_request' && github.ref || 'queue' }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - run: echo "WORK=$RUNNER_TEMP/nova" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            nova
            wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pick queued videos
        id: pick
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node nova/queue.mjs pick "$WORK"

      - name: Use the sample video (pull request)
        id: sample
        if: github.event_name == 'pull_request'
        run: |
          id=$(jq -r .id nova/sample-job.json)
          mkdir -p "$WORK/jobs"
          cp nova/sample-job.json "$WORK/jobs/$id.json"
          # synthetic "your own footage" (2 photos, 1 clip), the same layout nova/queue.mjs writes for uploads
          mkdir -p "$WORK/media/$id"
          cp nova/sample-media/* "$WORK/media/$id/"
          echo "ids=$id" >> "$GITHUB_OUTPUT"

      - name: Render with MoneyPrinterTurbo
        id: render
        if: steps.pick.outputs.ids != '' || steps.sample.outputs.ids != ''
        env:
          IDS: ${{ steps.pick.outputs.ids }}${{ steps.sample.outputs.ids }}
        run: |
          image=$(jq -r .image nova/upstream.json)
          mkdir -p "$WORK/out" "$WORK/storage"
          docker pull --quiet "$image"
          for id in $IDS; do
            echo "::group::render $id"
            # a clip with the EN and VI lines burned on (nova/overlay.py) runs in the same image, no footage search or voice
            if [ "$(jq -r '.engine // ""' "$WORK/jobs/$id.json")" = overlay ]; then
              docker run --rm \
                -v "$WORK:/work" \
                -v "$PWD/nova/overlay.py:/nova/overlay.py:ro" \
                -v "$PWD/nova/fonts/BeVietnamPro-Bold.ttf:/MoneyPrinterTurbo/resource/fonts/BeVietnamPro-Bold.ttf:ro" \
                "$image" python3 /nova/overlay.py "$id" || echo "::warning::overlay $id failed"
              echo "::endgroup::"
              continue
            fi
            docker run --rm \
              -v "$WORK:/work" \
              -v "$WORK/storage:/MoneyPrinterTurbo/storage" \
              -v "$PWD/nova/render.py:/nova/render.py:ro" \
              -v "$PWD/nova/fonts/BeVietnamPro-Bold.ttf:/MoneyPrinterTurbo/resource/fonts/BeVietnamPro-Bold.ttf:ro" \
              "$image" python3 /nova/render.py "$id" || echo "::warning::render $id failed"
            echo "::endgroup::"
          done

      - name: Store results in Nova
        if: always() && steps.pick.outputs.ids != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IDS: ${{ steps.pick.outputs.ids }}
        run: for id in $IDS; do node nova/queue.mjs store "$WORK" "$id"; done

      - name: Start again for the rest of the queue
        # pick takes at most 3; a full batch means more may be waiting, and the cron is too slow to rely on
        if: always() && steps.pick.outputs.ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ steps.pick.outputs.ids }}
        run: |
          set -- $IDS
          if [ "$#" -ge 3 ]; then gh workflow run nova-render.yml --repo "$GITHUB_REPOSITORY" --ref main; fi

      - name: Check the sample video (pull request)
        if: github.event_name == 'pull_request'
        env:
          ID: ${{ steps.sample.outputs.ids }}
        run: |
          cat "$WORK/out/$ID.json"
          jq -e '.footage == "upload"' "$WORK/out/$ID.json" >/dev/null || { echo "::error::the sample uploads were not used as footage"; exit 1; }
          mp4="$WORK/out/$ID.mp4"
          test -s "$mp4" || { echo "::error::no MP4 was made"; exit 1; }
          image=$(jq -r .image nova/upstream.json)
          probe() { docker run --rm -v "$WORK/out:/o" --entrypoint ffprobe "$image" -v error "$@"; }
          probe -show_entries stream=codec_type,codec_name,width,height:format=duration -of compact "/o/$ID.mp4"
          probe -select_streams a -show_entries stream=codec_type -of csv=p=0 "/o/$ID.mp4" | grep -q audio || { echo "::error::the MP4 has no audio"; exit 1; }
          mkdir -p "$WORK/check"
          for s in 2 8 14; do
            docker run --rm -v "$WORK/out:/o" -v "$WORK/check:/c" --entrypoint ffmpeg "$image" -v error -ss "$s" -i "/o/$ID.mp4" -frames:v 1 -vf scale=540:-2 "/c/frame-${s}s.png" || true
          done
          cp "$mp4" "$WORK/check/sample.mp4"
      - name: Check the clip + text overlay (pull request)
        if: github.event_name == 'pull_request'
        run: |
          image=$(jq -r .image nova/upstream.json)
          oid=11111111-1111-4111-8111-111111111111
          mkdir -p "$WORK/jobs" "$WORK/media/$oid" "$WORK/out"
          cp nova/sample-media/02.mp4 "$WORK/media/$oid/00.mp4"
          jq -n --arg id "$oid" '{id:$id, engine:"overlay", lines:["One idea on the clip.","A second idea, a little longer than the first."], viLines:["Một ý trên clip.","Ý thứ hai, dài hơn ý đầu một chút."]}' > "$WORK/jobs/$oid.json"
          docker run --rm -v "$WORK:/work" \
            -v "$PWD/nova/overlay.py:/nova/overlay.py:ro" \
            -v "$PWD/nova/fonts/BeVietnamPro-Bold.ttf:/MoneyPrinterTurbo/resource/fonts/BeVietnamPro-Bold.ttf:ro" \
            "$image" python3 /nova/overlay.py "$oid"
          cat "$WORK/out/$oid.json"
          jq -e .ok "$WORK/out/$oid.json" >/dev/null || { echo "::error::overlay failed"; exit 1; }
          test -s "$WORK/out/$oid.mp4" || { echo "::error::no overlay MP4"; exit 1; }
          mkdir -p "$WORK/check"
          docker run --rm -v "$WORK/out:/o" -v "$WORK/check:/c" --entrypoint ffmpeg "$image" -v error -ss 1 -i "/o/$oid.mp4" -frames:v 1 "/c/overlay-1s.png" || true
          cp "$WORK/out/$oid.mp4" "$WORK/check/overlay.mp4"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && always()
        with:
          name: nova-sample
          path: ${{ runner.temp }}/nova/check
          retention-days: 7
          if-no-files-found: ignore
