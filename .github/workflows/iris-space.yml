# Iris API Space: puts argus/space/ (Dockerfile + gate) and argus/upstream.json on the Hugging Face
# Space <user>/iris-gods-eye, which runs the upstream God's Eye View server for the routes the argus
# Worker does not answer itself (CCTV, Overpass, weather, traffic, radio, ...).
# Needs the repository secret HF_TOKEN (a Hugging Face "Write" token). The key between the Worker and
# the Space is derived from that token, so there is no second secret to keep.
name: Deploy Iris Space

on:
  push:
    branches: [main]
    paths: ['argus/space/**', 'argus/upstream.json', '.github/workflows/iris-space.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the token
        id: tok
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::warning::HF_TOKEN is not set; add it in Settings > Secrets > Actions"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - if: steps.tok.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.tok.outputs.ok == 'true'
        name: Create or update the Space
        run: |
          pip install --quiet huggingface_hub==0.36.0
          cp argus/upstream.json argus/space/upstream.json
          python - <<'PY'
          import hashlib, os
          from huggingface_hub import HfApi
          token = os.environ["HF_TOKEN"]
          api = HfApi(token=token)
          user = api.whoami()["name"]
          repo = f"{user}/iris-gods-eye"
          api.create_repo(repo, repo_type="space", space_sdk="docker", exist_ok=True)
          key = hashlib.sha256(f"{token}:iris".encode()).hexdigest()
          api.add_space_secret(repo, "IRIS_KEY", key)
          api.upload_folder(repo_id=repo, repo_type="space", folder_path="argus/space", commit_message=f"Deploy from stock-predict {os.environ['GITHUB_SHA'][:7]}")
          print(f"Space: https://huggingface.co/spaces/{repo}  API: https://{user.lower()}-iris-gods-eye.hf.space")
          PY
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - if: steps.tok.outputs.ok == 'true'
        name: Give the argus Worker the same key
        # run outside argus/ so wrangler does not read its config (the KV id there is filled in only at deploy)
        working-directory: ${{ runner.temp }}
        run: |
          printf '%s' "$(printf '%s:iris' "$HF_TOKEN" | sha256sum | cut -d' ' -f1)" | npx -y wrangler@4 secret put IRIS_KEY --name argus
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
