name: Backup KV Data

on:
  schedule:
    # Daily at 20:00 UTC (16:00 US Eastern)
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      note:
        description: "Backup note (optional)"
        required: false

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the snapshot to the `backups` branch
      actions: write # delete older backup artifacts
    steps:
      # The repo is public, so artifacts are downloadable by anyone signed in to GitHub.
      # Keep only the newest backup: delete every earlier kv-backup-* artifact first.
      - name: Delete older backup artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const arts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 })
            for (const a of arts.filter((a) => a.name.startsWith('kv-backup-'))) {
              await github.rest.actions.deleteArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id })
              core.info(`deleted ${a.name} (${a.id})`)
            }
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Backup KV namespaces
        run: node scripts/backup-kv.js --output-dir ./kv-backups
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: kv-backup-${{ github.run_number }}
          path: ./kv-backups/
          retention-days: 7

      - name: Archive backup to the `backups` branch
        # keeps a dated folder per day on its own branch (never touches main)
        run: |
          git config user.email "backup@stock-predict"
          git config user.name "Backup Bot"
          if git fetch origin backups:backups; then git worktree add bk backups; else git worktree add --orphan -b backups bk; fi
          mkdir -p bk/backups
          cp -r kv-backups/backup-* bk/backups/
          cd bk
          git add backups/
          git diff --cached --quiet || git commit -m "backup: KV data snapshot $(date -u +%Y-%m-%d)"
          git push origin backups
        if: success()
