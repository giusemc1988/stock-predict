; nexus-scout: a passive-only Wi-Fi + BLE scanner for the Neo Hub's Nexus page.
; It never transmits deauth, beacon spam, evil-portal or any other frame meant to affect
; someone else's device or network (AGENTS.md rule 5) -- it only listens and reports over
; its own BLE GATT service, or a status page on its own fallback AP.
;
; Two targets:
;   esp32-s3  - Chanh's board (N16R8, external IPEX antenna). Build this one first.
;   esp32dev  - a plain ESP32 (WROOM-32E) as a second, cheaper option.
; Both are 2.4 GHz only: neither target scans 5 GHz Wi-Fi.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
build_flags =
    -DNEXUS_SCOUT_VERSION=\"1.0.0\"
; WiFi + BLE + WebServer + ArduinoJson don't fit the default OTA-dual-partition app slot
; (~1.25 MB); huge_app.csv gives one ~3 MB app partition instead (no OTA, which this
; firmware doesn't use anyway -- it's reflashed with Volt, not updated over the air).
board_build.partitions = huge_app.csv

[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DNEXUS_SCOUT_BOARD=\"esp32-s3\"
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DNEXUS_SCOUT_BOARD=\"esp32\"
